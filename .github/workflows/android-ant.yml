name: Android Ant CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    env:
      LEGACY_ANDROID_HOME: ${{ github.workspace }}/../android-legacy-sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Ant and unzip
        run: sudo apt-get install -y ant unzip

      - name: Install isolated legacy SDK
        run: |
          mkdir -p "$LEGACY_ANDROID_HOME"
          (yes || true) | sdkmanager --sdk_root="$LEGACY_ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$LEGACY_ANDROID_HOME" --install \
            "platforms;android-20" "build-tools;28.0.3" "platform-tools"

      - name: Install legacy Android SDK tools
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/tools_r25.2.5-linux.zip \
            --output /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$LEGACY_ANDROID_HOME"
          test -f "$LEGACY_ANDROID_HOME/tools/lib/ant-tasks.jar"
          test -f "$LEGACY_ANDROID_HOME/build-tools/28.0.3/lib/dx.jar"

      - name: Set up Java 8 for Ant build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Android 4.2.2 compatibility
        working-directory: androidVNC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          android = "{http://schemas.android.com/apk/res/android}"
          manifest = ElementTree.parse("AndroidManifest.xml").getroot()
          uses_sdk = manifest.find("uses-sdk")
          if uses_sdk is None:
              raise SystemExit("AndroidManifest.xml must declare uses-sdk")

          min_sdk = int(uses_sdk.get(android + "minSdkVersion", "1"))
          target_sdk = int(uses_sdk.get(android + "targetSdkVersion", str(min_sdk)))
          if min_sdk > 17 or target_sdk > 17:
              raise SystemExit("Android 4.2.2 compatibility requires minSdkVersion and targetSdkVersion <= 17")

          properties = {
              key.strip(): value.strip()
              for line in Path("project.properties").read_text(encoding="utf-8").splitlines()
              if "=" in line and not line.lstrip().startswith("#")
              for key, value in [line.split("=", 1)]
          }
          if properties.get("target") != "android-20":
              raise SystemExit("Compile SDK 20 is required for the guarded API 19 UI implementation")

          library_properties = Path("../ZoomerWithKeys/project.properties").read_text()
          if "target=android-20" not in library_properties.splitlines():
              raise SystemExit("ZoomerWithKeys must also compile against android-20")

          print(f"Manifest/SDK configuration OK: minSdk={min_sdk}, targetSdk={target_sdk}, compileSdk=20")
          PY

      - name: Test rotation mapping
        run: |
          mkdir -p /tmp/rotation-tests
          javac -d /tmp/rotation-tests \
            androidVNC/src/android/androidVNC/RotationCycle.java tests/RotationCycleTest.java
          java -cp /tmp/rotation-tests android.androidVNC.RotationCycleTest

      - name: Build debug APK
        working-directory: androidVNC
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          ant -Dsdk.dir="$LEGACY_ANDROID_HOME" clean debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-vnc-debug
          path: androidVNC/bin/*-debug.apk
          if-no-files-found: error
          retention-days: 14
