name: Android APK CI and Releases

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-22.04
    env:
      LEGACY_ANDROID_HOME: ${{ github.workspace }}/../android-legacy-sdk
      RELEASE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test versioning and publication logic
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Set APK version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$RELEASE_BUILD" = true ]; then
            python3 scripts/release_version.py --release --run-number "$RUN_NUMBER"
          else
            python3 scripts/release_version.py --run-number "$RUN_NUMBER"
          fi

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Ant and unzip
        run: sudo apt-get install -y ant unzip

      - name: Install isolated legacy SDK
        run: |
          mkdir -p "$LEGACY_ANDROID_HOME"
          (yes || true) | sdkmanager --sdk_root="$LEGACY_ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$LEGACY_ANDROID_HOME" --install \
            "platforms;android-20" "build-tools;28.0.3" "platform-tools"

      - name: Install legacy Android SDK tools
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/tools_r25.2.5-linux.zip \
            --output /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$LEGACY_ANDROID_HOME"
          test -f "$LEGACY_ANDROID_HOME/tools/lib/ant-tasks.jar"
          test -f "$LEGACY_ANDROID_HOME/build-tools/28.0.3/lib/dx.jar"

      - name: Set up Java 8 for Ant build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Android 4.2.2 compatibility
        working-directory: androidVNC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          android = "{http://schemas.android.com/apk/res/android}"
          manifest = ElementTree.parse("AndroidManifest.xml").getroot()
          uses_sdk = manifest.find("uses-sdk")
          if uses_sdk is None:
              raise SystemExit("AndroidManifest.xml must declare uses-sdk")

          min_sdk = int(uses_sdk.get(android + "minSdkVersion", "1"))
          target_sdk = int(uses_sdk.get(android + "targetSdkVersion", str(min_sdk)))
          if min_sdk > 17 or target_sdk > 17:
              raise SystemExit("Android 4.2.2 compatibility requires minSdkVersion and targetSdkVersion <= 17")

          properties = {
              key.strip(): value.strip()
              for line in Path("project.properties").read_text(encoding="utf-8").splitlines()
              if "=" in line and not line.lstrip().startswith("#")
              for key, value in [line.split("=", 1)]
          }
          if properties.get("target") != "android-20":
              raise SystemExit("Compile SDK 20 is required for the guarded API 19 UI implementation")

          library_properties = Path("../ZoomerWithKeys/project.properties").read_text()
          if "target=android-20" not in library_properties.splitlines():
              raise SystemExit("ZoomerWithKeys must also compile against android-20")

          print(f"Manifest/SDK configuration OK: minSdk={min_sdk}, targetSdk={target_sdk}, compileSdk=20")
          PY

      - name: Test rotation mapping
        run: |
          mkdir -p /tmp/rotation-tests
          javac -d /tmp/rotation-tests \
            androidVNC/src/android/androidVNC/RotationCycle.java tests/RotationCycleTest.java
          java -cp /tmp/rotation-tests android.androidVNC.RotationCycleTest

      - name: Build signed release APK
        if: env.RELEASE_BUILD == 'true'
        working-directory: androidVNC
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Persistent signing key is required'; exit 1; }
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          chmod 600 "$signing_dir/release.keystore"
          ant -Dsdk.dir="$LEGACY_ANDROID_HOME" \
            -Dkey.store="$signing_dir/release.keystore" -Dkey.alias=androiddebugkey \
            -Dkey.store.password=android -Dkey.alias.password=android clean release

      - name: Build development APK
        if: env.RELEASE_BUILD != 'true'
        working-directory: androidVNC
        run: |
          ant -Dsdk.dir="$LEGACY_ANDROID_HOME" clean debug

      - name: Verify APK and prepare distribution
        env:
          APK_VERSION: ${{ steps.version.outputs.version }}
          APK_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          tools="$LEGACY_ANDROID_HOME/build-tools/28.0.3"
          if [ "$RELEASE_BUILD" = true ]; then
            apk=androidVNC/bin/android_rules-release.apk
            python3 scripts/verify_apk.py --apk "$apk" --tools "$tools" \
              --version "$APK_VERSION" --code "$APK_CODE" --release \
              --expected-cert 185900e3436a64e868ba0b89180f046b90aa239711ca200772488a6f90932a92
            cp "$apk" "dist/androidVNC2026-$RELEASE_TAG.apk"
          else
            apk=androidVNC/bin/android_rules-debug.apk
            python3 scripts/verify_apk.py --apk "$apk" --tools "$tools" \
              --version "$APK_VERSION" --code "$APK_CODE"
            cp "$apk" "dist/androidVNC2026-$APK_VERSION-debug.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: android-vnc-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out built commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified distribution
        uses: actions/download-artifact@v4
        with:
          name: android-vnc-${{ github.run_id }}
          path: dist

      - name: Verify downloaded checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish versioned APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/publish_release.py --tag "$RELEASE_TAG" --commit "$BUILT_COMMIT"
