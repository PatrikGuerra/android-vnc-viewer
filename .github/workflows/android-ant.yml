name: Android Ant CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Ant and unzip
        run: sudo apt-get install -y ant unzip

      - name: Install Android API 17
        run: sdkmanager --install "platforms;android-17"

      - name: Install legacy Android SDK tools
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/tools_r25.2.5-linux.zip \
            --output /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/tools/lib/ant-tasks.jar"

      - name: Build debug APK
        working-directory: androidVNC
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ant clean debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-vnc-debug
          path: androidVNC/bin/*.apk
          if-no-files-found: error
          retention-days: 14
