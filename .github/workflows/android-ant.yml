name: Android Ant CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Ant and unzip
        run: sudo apt-get install -y ant unzip

      - name: Install Android API 17
        run: sdkmanager --install "platforms;android-17"

      - name: Install legacy Android SDK tools
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/tools_r25.2.5-linux.zip \
            --output /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/tools/lib/ant-tasks.jar"

      - name: Set up Java 8 for Ant build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Android 4.2.2 compatibility
        working-directory: androidVNC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          android = "{http://schemas.android.com/apk/res/android}"
          manifest = ElementTree.parse("AndroidManifest.xml").getroot()
          uses_sdk = manifest.find("uses-sdk")
          if uses_sdk is None:
              raise SystemExit("AndroidManifest.xml must declare uses-sdk")

          min_sdk = int(uses_sdk.get(android + "minSdkVersion", "1"))
          target_sdk = int(uses_sdk.get(android + "targetSdkVersion", str(min_sdk)))
          if min_sdk > 17 or target_sdk > 17:
              raise SystemExit("Android 4.2.2 compatibility requires minSdkVersion and targetSdkVersion <= 17")

          properties = {
              key.strip(): value.strip()
              for line in Path("project.properties").read_text(encoding="utf-8").splitlines()
              if "=" in line and not line.lstrip().startswith("#")
              for key, value in [line.split("=", 1)]
          }
          if properties.get("target") != "android-17":
              raise SystemExit("The project must compile against android-17")

          print(f"Compatibility OK: minSdk={min_sdk}, targetSdk={target_sdk}, compileSdk=17")
          PY

      - name: Build debug APK
        working-directory: androidVNC
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ant clean debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-vnc-debug
          path: androidVNC/bin/*.apk
          if-no-files-found: error
          retention-days: 14
